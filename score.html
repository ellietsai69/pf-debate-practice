<h1>評分與錯題本</h1><p class="lead">家長不懂規則也能評：聽完問自己，「我能不能說出這一隊為什麼贏？」</p><h2>每週評分</h2><div class="card"><label for="wk">週次</label><select id="wk"></select><div id="qs"></div><p class="q">總分 <span id="tot">0</span> / 12</p><button class="go" id="save">存下這週</button> <span id="msg" role="status"></span></div><h3>紀錄</h3><ul id="scores"></ul>
<h2>錯題本</h2><form class="card" id="mf"><p><label for="ma">哪個環節</label><select id="ma"><option>Constructive</option><option>Crossfire</option><option>Rebuttal</option><option>Summary</option><option>Final Focus</option></select></p><p><label for="mb">發生什麼、為什麼</label><input type="text" id="mb" required maxlength="150"></p><p><label for="mc">下次一句話怎麼說</label><input type="text" id="mc" required maxlength="200"></p><p class="small">請不要寫姓名、學校等個人資料。</p><button class="go">加入錯題本</button></form><ul id="errs"></ul>
